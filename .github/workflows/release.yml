name: Release desktop installers

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"
  CARGO_PACKAGER_VERSION: "0.11.8"
  NFPM_VERSION: "2.47.0"

jobs:
  prepare-data:
    name: Prepare verified offline data
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Match tag and Cargo versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version=${GITHUB_REF_NAME#v}
          cargo_version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          test "$tag_version" = "$cargo_version"

      - name: Verify tracked package inputs
        run: python tools/verify-package-inputs

      - name: Fetch the complete offline data set
        run: |
          ./tools/fetch-ephemeris --all
          ./tools/fetch-geonames
          python tools/verify-release-data

      - uses: actions/upload-artifact@v4
        with:
          name: meridian-offline-data
          path: |
            data/ephe/*.se1
            data/geonames/*.txt
            data/geonames/SOURCE
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-data
    if: github.server_url == 'https://github.com'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-22.04
            platform: linux
            rust-targets: ""
          - name: macOS universal
            runner: macos-14
            platform: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows x86-64
            runner: windows-2025
            platform: windows
            rust-targets: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: meridian-offline-data
          path: data

      - name: Verify bundled data
        run: python tools/verify-release-data

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install native Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils \
            libdbus-1-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            rpm

      - name: Install cargo-packager
        run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
        shell: bash

      - name: Build Linux application
        if: matrix.platform == 'linux'
        run: cargo build --locked --release --bin meridian

      - name: Build AppImage
        if: matrix.platform == 'linux'
        run: ./packaging/package-appimage

      - name: Install nFPM
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          base_url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/nfpm-checksums.txt" "$base_url/checksums.txt"
          cd "$RUNNER_TEMP"
          sha256sum --ignore-missing --check nfpm-checksums.txt
          tar --extract --gzip --file "$archive" nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm

      - name: Prepare optional RPM signing
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "MERIDIAN_NFPM_CONFIG=packaging/nfpm.yaml" >> "$GITHUB_ENV"
          if [[ -z "$LINUX_GPG_PRIVATE_KEY" ]]; then
            exit 0
          fi
          umask 077
          key_path="$RUNNER_TEMP/meridian-rpm-private-key.gpg"
          signed_config="$RUNNER_TEMP/meridian-nfpm-signed.yaml"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode > "$key_path"
          cp packaging/nfpm.yaml "$signed_config"
          printf '\nrpm:\n  signature:\n    key_file: %s\n' "$key_path" >> "$signed_config"
          echo "MERIDIAN_NFPM_CONFIG=$signed_config" >> "$GITHUB_ENV"
          echo "MERIDIAN_RPM_SIGNED=true" >> "$GITHUB_ENV"

          signing_home="$RUNNER_TEMP/meridian-rpm-gnupg"
          mkdir -m 0700 "$signing_home"
          GNUPGHOME="$signing_home" gpg --batch --import "$key_path"
          fingerprint=$(GNUPGHOME="$signing_home" gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"
          mkdir -p dist
          GNUPGHOME="$signing_home" gpg --batch --armor --export "$fingerprint" > dist/meridian-rpm-signing-key.asc

      - name: Build DEB and RPM packages
        if: matrix.platform == 'linux'
        run: ./packaging/package-linux

      - name: Inspect Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          deb=$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)
          rpm_package=$(find dist -maxdepth 1 -type f -name '*.rpm' -print -quit)
          test -n "$appimage"
          test -n "$deb"
          test -n "$rpm_package"
          desktop-file-validate packaging/meridian.desktop
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" > "$RUNNER_TEMP/meridian-deb-contents.txt"
          grep -q 'usr/share/meridian/data/ephe' "$RUNNER_TEMP/meridian-deb-contents.txt"
          rpm -qpi "$rpm_package"
          rpm -qlp "$rpm_package" > "$RUNNER_TEMP/meridian-rpm-contents.txt"
          grep -q '/usr/share/meridian/data/ephe' "$RUNNER_TEMP/meridian-rpm-contents.txt"
          if [[ "${MERIDIAN_RPM_SIGNED:-}" == "true" ]]; then
            rpm -Kv "$rpm_package" > "$RUNNER_TEMP/meridian-rpm-signature.txt" 2>&1
            grep -q 'Signature' "$RUNNER_TEMP/meridian-rpm-signature.txt"
          fi

          appimage_check="$RUNNER_TEMP/meridian-appimage-check"
          mkdir -p "$appimage_check"
          appimage=$(realpath "$appimage")
          chmod +x "$appimage"
          cd "$appimage_check"
          "$appimage" --appimage-extract >/dev/null
          test -d squashfs-root/usr/lib/meridian/data/ephe
          test -d squashfs-root/usr/lib/meridian/data/geonames

      - name: Build universal macOS application
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          cargo build --locked --release --bin meridian --target aarch64-apple-darwin
          cargo build --locked --release --bin meridian --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/meridian \
            target/x86_64-apple-darwin/release/meridian \
            -output target/universal-apple-darwin/release/meridian
          lipo -info target/universal-apple-darwin/release/meridian
          cargo packager \
            --release \
            --target universal-apple-darwin \
            --formats dmg \
            --out-dir dist

      - name: Inspect macOS application
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_point="$RUNNER_TEMP/meridian-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg"
          app=$(find "$mount_point" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict "$app"
          test -d "$app/Contents/Resources/data/ephe"
          test -d "$app/Contents/Resources/data/geonames"
          hdiutil detach "$mount_point"

      - name: Build Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          cargo build --locked --release --bin meridian
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "meridian-signing.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Where-Object FullName -Match '\\x64\\' |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw "signtool.exe was not found" }
            & $signTool sign /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target/release/meridian.exe
            "MERIDIAN_WINDOWS_SIGNTOOL=$signTool" | Out-File -FilePath $env:GITHUB_ENV -Append
            "MERIDIAN_WINDOWS_CERTIFICATE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
            "MERIDIAN_WINDOWS_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Require Windows GUI subsystem
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("target/release/meridian.exe")
          $peHeader = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peHeader + 92)
          if ($subsystem -ne 2) {
            throw "meridian.exe uses PE subsystem $subsystem instead of Windows GUI (2)"
          }

      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build and optionally sign Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          cargo packager --release --formats nsis --out-dir dist
          $installer = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not created" }
          if ($env:MERIDIAN_WINDOWS_SIGNED -eq "true") {
            & $env:MERIDIAN_WINDOWS_SIGNTOOL sign /f $env:MERIDIAN_WINDOWS_CERTIFICATE /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
            & $env:MERIDIAN_WINDOWS_SIGNTOOL verify /pa $installer.FullName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/attest@v4
        with:
          subject-path: dist/*

  publish:
    name: Publish complete release
    needs: build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: meridian-*
          path: dist
          merge-multiple: true

      - name: Require every platform artifact
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.exe' -print -quit)"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/meridian-release-notes.md"
          cat > "$notes" <<'NOTES'
          Every installer contains the complete Swiss Ephemeris coefficient set and city atlas for offline use.

          The macOS DMG is ad-hoc signed and requires one Gatekeeper approval through Privacy & Security on first launch. Windows may show an Unknown publisher prompt when the release repository has no Authenticode certificate configured.
          NOTES
          mapfile -d '' -t release_assets < <(find dist -maxdepth 1 -type f -print0)
          test "${#release_assets[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Meridian $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --generate-notes
