[package]
name = "meridian"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A high-precision classical septenary astrology workbench"
license = "AGPL-3.0-or-later"
homepage = "https://github.com/blackopsrepl/meridian"
repository = "https://github.com/blackopsrepl/meridian"
authors = ["BlackOps REPL"]
default-run = "meridian"

[[bin]]
name = "meridian"
path = "src/main.rs"

[[bin]]
name = "meridian-cli"
path = "src/bin/meridian-cli.rs"

[package.metadata.packager]
product-name = "Meridian"
identifier = "org.blackopsrepl.meridian"
category = "Reference"
icons = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
]

[[package.metadata.packager.binaries]]
path = "meridian"
main = true

[[package.metadata.packager.resources]]
src = "data/ephe"
target = "data/ephe"

[[package.metadata.packager.resources]]
src = "data/geonames"
target = "data/geonames"

[[package.metadata.packager.file-associations]]
extensions = ["meridian"]
mime-type = "application/x-meridian-chart"
description = "Meridian chart"
name = "Meridian chart"
role = "editor"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
signing-identity = "-"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "icons/icon.ico"
appdata-paths = ["$LOCALAPPDATA/Meridian"]

[dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = { version = "=0.10.4", features = ["serde"] }
clap = { version = "=4.6.6", features = ["derive", "env"] }
csv = "=1.4.0"
iced = { version = "=0.14.0", features = ["canvas", "tokio"] }
rfd = "=0.17.2"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
swisseph = { package = "swisseph-rs", version = "=0.1.9", features = ["serde"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Range checks make these small civil-time and table-index conversions explicit.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Public APIs expose domain errors through typed Result values; prose docs live in docs/.
missing_errors_doc = "allow"
# Direct push_str assembly keeps the self-contained SVG renderer legible.
format_push_string = "allow"
# Native desktop views and strict astrological calculations are intentionally cohesive.
too_many_lines = "allow"
needless_pass_by_value = "allow"
double_must_use = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
