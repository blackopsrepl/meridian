[package]
name = "meridian"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A high-precision classical septenary astrology workbench"
license = "AGPL-3.0-or-later"
default-run = "meridian"

[[bin]]
name = "meridian"
path = "src/main.rs"

[[bin]]
name = "meridian-cli"
path = "src/bin/meridian-cli.rs"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["form", "json", "macros", "query"] }
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = { version = "=0.10.4", features = ["serde"] }
clap = { version = "=4.6.6", features = ["derive", "env"] }
csv = "=1.4.0"
maud = { version = "=0.27.0", features = ["axum"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
swisseph = { package = "swisseph-rs", version = "=0.1.9", features = ["serde"] }
tauri = { version = "=2.11.5", features = [] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.0", features = ["compression-gzip", "limit", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
urlencoding = "=2.1.3"
uuid = { version = "=1.24.0", features = ["serde", "v7"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Range checks make these small civil-time and table-index conversions explicit.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Public APIs expose domain errors through typed Result values; prose docs live in docs/.
missing_errors_doc = "allow"
# Direct push_str assembly keeps the self-contained SVG renderer legible.
format_push_string = "allow"
# Maud templates are intentionally cohesive page renderers.
too_many_lines = "allow"
needless_pass_by_value = "allow"
double_must_use = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
