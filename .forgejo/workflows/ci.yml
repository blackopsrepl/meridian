name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  check:
    name: Native desktop application
    runs-on: tauri

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Fetch test ephemeris
        run: ./tools/fetch-ephemeris --current

      - name: Verify tracked package inputs
        run: python3 tools/verify-package-inputs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build native desktop and CLI binaries
        run: cargo build --locked --bins
